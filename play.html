<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#eefbff,#fffaf0);min-height:100vh;color:#263238}.wrap{width:min(760px,95%);margin:0 auto;padding:14px 0 36px}.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.back{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#fff;color:#475569;text-decoration:none;font-size:28px;font-weight:900;box-shadow:0 6px 18px rgba(30,41,59,.1)}.top-title{font-weight:900;font-size:20px;flex:1;text-align:center;padding-right:48px}.progress{height:12px;background:#dfe8ef;border-radius:999px;overflow:hidden;margin-bottom:12px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#38bdf8);transition:width .3s}.card{background:rgba(255,255,255,.97);border-radius:28px;padding:22px;box-shadow:0 16px 40px rgba(40,64,84,.12);margin-bottom:14px}.scene{text-align:center}.badge{display:inline-block;border-radius:999px;padding:7px 13px;background:#f1f5f9;color:#64748b;font-weight:900;font-size:13px;margin-bottom:7px}h1{font-size:clamp(25px,7vw,36px);margin:7px 0 9px}.story{font-size:clamp(17px,4.5vw,21px);color:#52606d;line-height:1.7;margin:0 auto 16px;max-width:620px;font-weight:700}.answer-box{margin:15px auto 0;background:#f0fdf4;border:3px solid #86efac;border-radius:20px;padding:16px;max-width:620px;display:none}.answer-main{font-size:clamp(26px,7vw,40px);font-weight:900;color:#166534}.answer-sub{font-size:16px;color:#3f6b4c;font-weight:750;line-height:1.7;margin-top:8px}.equation{font-size:clamp(31px,9vw,48px);font-weight:950;letter-spacing:.03em;margin:10px 0;color:#4338ca}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:18px;padding:15px 20px;font-size:18px;font-weight:900;cursor:pointer;min-height:56px}button:active{transform:scale(.98)}.primary{background:#4f46e5;color:#fff}.share-btn{background:#0ea5e9;color:#fff}.next{background:#16a34a;color:#fff}.soft{background:#e2e8f0;color:#475569}.feedback{min-height:34px;font-size:17px;font-weight:900;color:#0369a1;margin:7px 0}.celebrate{font-size:40px;min-height:48px;margin:7px 0}.mini-note{font-size:14px;color:#64748b;font-weight:700;line-height:1.6;margin-top:10px}.friend-panel{max-width:650px;margin:0 auto 13px;background:#fff;border:2px solid #e2e8f0;border-radius:20px;padding:10px 12px}.friend-title{font-size:12px;font-weight:900;color:#64748b;margin-bottom:7px}.friend-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.friend-chip{min-width:52px;padding:6px 7px;border-radius:14px;background:#f1f5f9;border:2px solid #e2e8f0;font-size:25px;line-height:1}.friend-chip.locked{filter:grayscale(1);opacity:.34}.friend-chip.new{border-color:#fbbf24;background:#fffbeb;animation:pop 1s ease-in-out infinite alternate}.friend-name{font-size:10px;color:#64748b;font-weight:900;display:block;margin-top:3px}@keyframes pop{to{transform:translateY(-3px) scale(1.04)}}.add-sources{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:620px;margin:8px auto 12px}.add-source{background:#fff7ed;border:3px solid #fdba74;border-radius:20px;padding:12px;min-height:112px}.add-source-title{font-weight:900;color:#9a3412;margin-bottom:8px}.add-source-items{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;min-height:58px}.add-target{max-width:620px;margin:0 auto 10px;background:#eff6ff;border:4px dashed #93c5fd;border-radius:24px;padding:14px;min-height:145px;transition:.15s}.add-target.drop-ready{background:#e0f2fe;border-color:#0ea5e9;transform:scale(1.02)}.add-target.done{background:#f0fdf4;border-color:#86efac}.add-target-title{font-size:18px;font-weight:900;color:#1d4ed8;margin-bottom:8px}.add-target-items{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;font-size:34px;min-height:52px;align-items:center}.pool{background:#fff7ed;border:3px solid #fdba74;border-radius:22px;padding:13px;margin:10px auto 14px;max-width:650px}.pool-title{font-weight:900;color:#9a3412;margin-bottom:8px}.pool-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(50px,54px));justify-content:center;gap:8px;min-height:62px}.source-slot{width:54px;height:54px;display:grid;place-items:center;border-radius:15px}.source-slot.used{border:3px dashed #d7b48e;background:rgba(255,255,255,.35);position:relative}.source-slot.used::after{content:"";width:18px;height:18px;border:2px dashed #d7b48e;border-radius:50%;opacity:.8}.drag-item{width:54px;height:54px;display:inline-grid;place-items:center;background:#fff;border-radius:15px;font-size:35px;box-shadow:0 5px 12px rgba(124,74,20,.17);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .12s,opacity .12s}.drag-item:active{transform:scale(1.08);cursor:grabbing}.drag-ghost{position:fixed;z-index:9999;width:62px;height:62px;display:grid;place-items:center;font-size:42px;background:#fff;border:3px solid #38bdf8;border-radius:18px;box-shadow:0 12px 28px rgba(15,23,42,.25);pointer-events:none;transform:translate(-50%,-50%) rotate(-5deg)}.people{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px auto;max-width:680px}.person{min-width:112px;flex:1 1 112px;max-width:160px;background:#f8fafc;border:3px solid #cbd5e1;border-radius:22px;padding:11px 8px;min-height:178px;transition:.15s}.person.drop-ready,.invite-current.drop-ready{border-color:#38bdf8!important;background:#effaff!important;transform:scale(1.035)}.person.full{border-color:#86efac;background:#f0fdf4}.face{font-size:43px;margin-bottom:4px}.person-label{font-size:12px;color:#64748b;font-weight:800}.person-items{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;min-height:54px;margin-top:7px}.target-slot{width:34px;height:34px;border:2px dashed #cbd5e1;border-radius:50%;display:grid;place-items:center;font-size:23px;background:#fff}.target-slot.filled{border-style:solid;border-color:#86efac;background:#fff}.count-label{font-size:15px;color:#475569;font-weight:900;margin-top:6px}.mood{height:24px;font-size:13px;font-weight:900;color:#64748b;margin-top:4px}.invite-stage{max-width:650px;margin:10px auto}.invite-rule{display:inline-block;background:#fef3c7;border:2px solid #fcd34d;border-radius:18px;padding:9px 14px;font-weight:900;color:#92400e;margin-bottom:10px}.invited-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.invited-card{width:88px;background:#f0fdf4;border:2px solid #86efac;border-radius:18px;padding:8px}.invited-card .face{font-size:34px}.invite-current{max-width:210px;margin:0 auto;background:#f8fafc;border:4px dashed #94a3b8;border-radius:24px;padding:12px;transition:.15s}.invite-current .person-items{justify-content:center}.choice-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.choice{min-width:82px;background:#fff;border:3px solid #93c5fd;color:#1d4ed8;font-size:24px}.choice.good{background:#dcfce7;border-color:#86efac;color:#166534}.choice.bad{background:#fff7ed;border-color:#fdba74;color:#9a3412}.meaning{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.meaning>div{border-radius:15px;padding:11px 6px;font-weight:850;font-size:14px;line-height:1.45}.meaning .all{background:#fff7ed;color:#9a3412}.meaning .groups{background:#eff6ff;color:#1d4ed8}.meaning .each{background:#f0fdf4;color:#166534}.arrival{max-width:620px;margin:0 auto;text-align:center}.arrival-face{font-size:92px;animation:arrive .55s cubic-bezier(.2,.8,.2,1)}@keyframes arrive{0%{transform:translateY(30px) scale(.4);opacity:0}100%{transform:none;opacity:1}}.party-ground{font-size:38px;line-height:1.7;background:linear-gradient(180deg,#eff6ff,#ecfccb);border-radius:24px;padding:15px;margin:12px auto;max-width:620px}.party-decor{font-size:28px;letter-spacing:5px}.shake{animation:shake .25s linear 2}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-width:520px){.card{padding:16px}.person{min-width:92px;flex-basis:92px;min-height:164px;padding:9px 6px}.face{font-size:36px}.target-slot{width:30px;height:30px;font-size:20px}.meaning{grid-template-columns:1fr}.top-title{font-size:17px}.drag-item,.source-slot{width:48px;height:48px}.drag-item{font-size:31px}.pool-items{grid-template-columns:repeat(auto-fit,minmax(44px,48px));gap:7px}.add-source{padding:10px}.add-target{min-height:132px}.friend-chip{min-width:46px;font-size:22px}}
</style>

<body>
<div class="wrap"><div class="top"><a class="back" href="index.html">‹</a><div class="top-title" id="topTitle">はじめから</div></div><div class="progress"><div id="bar"></div></div><main class="card scene" id="scene"></main></div>
<script>
const params=new URLSearchParams(location.search);const mode=params.get('mode')==='share'?'share':'learn';const scene=document.getElementById('scene'),bar=document.getElementById('bar');document.getElementById('topTitle').textContent=mode==='share'?'🌳 森のおやつパーティー':'🌟 はじめから';
const animals=[{icon:'🐰',name:'うさぎ'},{icon:'🐯',name:'とら'},{icon:'🐼',name:'ぱんだ'},{icon:'🦊',name:'きつね'},{icon:'🐻',name:'くま'}];const learnKey='warizanLearnStageV3',forestKey='warizanForestPartyV1';let learnStage=Math.min(Number(localStorage.getItem(learnKey)||0),4),state={},addState={},forest=loadForest();
const forestStages=[{type:'share',title:'クッキーを わけよう',total:4,people:2,item:'🍪',guide:true,intro:'さいしょは4こだけ。点線を見ながら、ふたりに同じだけ配ろう。'},{type:'share',title:'いちごを わけよう',total:6,people:2,item:'🍓',guide:false,intro:'こんどは6こ。配った場所は点線で残るよ。'},{type:'share',title:'3人で わけよう',total:6,people:3,item:'🍬',guide:false,intro:'ぱんだも来たよ。6こを3人に同じだけ配ろう。'},{type:'share',title:'ひとり何こ？',total:8,people:2,item:'🧁',guide:false,askEach:true,intro:'配り終わったら「ひとり何こ？」も見てみよう。'},{type:'share',title:'4人で わけよう',total:8,people:4,item:'🍎',guide:false,askEach:true,intro:'きつねも遊びにきた！4人に同じだけ配ってみよう。'},{type:'invite',title:'何人よべるかな？',total:6,each:2,item:'🍪',intro:'ひとり2こずつなら、何人のお友だちを呼べるかな？'},{type:'invite',title:'もっと よんでみよう',total:8,each:2,item:'🍓',intro:'8こを、ひとり2こずつ。お友だちは何人来られるかな？'},{type:'share',title:'3人のおやつ会',total:9,people:3,item:'🍇',guide:false,askEach:true,intro:'少しだけ数が増えるよ。でも3人に配るだけ。'},{type:'share',title:'森のみんなで',total:10,people:5,item:'🍩',guide:false,askEach:true,intro:'なかまがそろったよ！5人みんなに同じだけ。'},{type:'party',title:'森のおやつパーティー'}];const unlockAfter={0:2,2:3,4:4,6:5};
function loadForest(){try{const v=JSON.parse(localStorage.getItem(forestKey)||'null');if(v&&Number.isFinite(v.step))return{step:v.step,friends:v.friends||1,helps:v.helps||0,partyWins:v.partyWins||0}}catch(e){}return{step:0,friends:1,helps:0,partyWins:0}}function saveForest(){localStorage.setItem(forestKey,JSON.stringify(forest))}function repeat(icon,n){return Array.from({length:n},()=>icon).join('')}function button(label,cls='primary',id='action'){return `<button class="${cls}" id="${id}">${label}</button>`}function bind(id,fn){const el=document.getElementById(id);if(el)el.addEventListener('click',fn)}function setProgress(v){bar.style.width=`${Math.max(0,Math.min(100,v))}%`}
function renderLearn(){setProgress((learnStage/5)*100);if(learnStage===0)renderAdd();else if(learnStage===1)startLearnShare({total:4,people:2,item:'🍪'},1);else if(learnStage===2)startLearnShare({total:6,people:3,item:'🍓'},2);else if(learnStage===3)renderEquationMeaning();else renderMultiplyLink()}function finishLearnStage(){learnStage++;localStorage.setItem(learnKey,String(Math.min(learnStage,5)));if(learnStage>=5)renderLearnFinish();else renderLearn()}
function renderAdd(){addState={left:3,right:3,gathered:0,done:false};scene.innerHTML=`<div class="badge">1 / 5　まずは「ぜんぶ」を見る</div><h1>りんごを ひとつに あつめよう</h1><p class="story">左に3こ、右にも3こ。<br>りんごを指でつかんで、<strong>ぜんぶのかご</strong>へ入れてみよう。</p><div class="add-sources"><div class="add-source"><div class="add-source-title">3こ</div><div class="add-source-items" id="addLeft"></div></div><div class="add-source"><div class="add-source-title">3こ</div><div class="add-source-items" id="addRight"></div></div></div><div class="add-target" id="addTarget"><div class="add-target-title">🧺 ぜんぶのかご</div><div class="add-target-items" id="addTargetItems">ここに あつめよう</div></div><div class="feedback" id="addFeedback">👇 りんごをつかんで、かごへ動かそう！</div><div class="answer-box" id="answer"><div class="answer-main">ぜんぶで 6こ！</div><div class="equation">3 ＋ 3 ＝ 6</div><div class="answer-sub">3こと3こを、ひとつに集めたら6こになったね。<br><strong>足し算は「集める」計算</strong>だよ。</div><div class="actions">${button('つぎへ →','next','next')}</div></div>`;renderAddItems();bind('next',finishLearnStage)}function renderAddItems(){const left=document.getElementById('addLeft'),right=document.getElementById('addRight'),targetItems=document.getElementById('addTargetItems');if(!left||!right||!targetItems)return;left.innerHTML=Array.from({length:addState.left},()=>'<span class="drag-item add-drag" data-add-source="left">🍎</span>').join('');right.innerHTML=Array.from({length:addState.right},()=>'<span class="drag-item add-drag" data-add-source="right">🍎</span>').join('');targetItems.textContent=addState.gathered?repeat('🍎',addState.gathered):'ここに あつめよう';document.querySelectorAll('.add-drag').forEach(el=>el.addEventListener('pointerdown',startAddDrag))}function startAddDrag(e){if(addState.done)return;e.preventDefault();const source=e.currentTarget,group=source.dataset.addSource,target=document.getElementById('addTarget');dragElement(e,'🍎',target,()=>target.classList.add('drop-ready'),()=>target.classList.remove('drop-ready'),()=>collectApple(group))}function collectApple(group){if(addState.done||addState[group]<=0)return;addState[group]--;addState.gathered++;document.getElementById('addFeedback').textContent=`かごに ${addState.gathered}こ あつまったよ！`;renderAddItems();if(addState.gathered===6){addState.done=true;document.getElementById('addTarget').classList.add('done');document.getElementById('addFeedback').textContent='🎉 3こと3こが、ひとつになった！';document.getElementById('answer').style.display='block'}}
function startLearnShare(problem,learnIndex){state={kind:'learnShare',problem,learnIndex,remaining:problem.total,counts:Array(problem.people).fill(0),done:false};renderShareBoard({title:learnIndex===1?'おやつを わけてみよう':'みんなに おなじだけ！',intro:'おやつを指でつかんで、あげたい子のところへ動かしてね。',guide:learnIndex===1,learn:true})}function renderEquationMeaning(){setProgress(60);scene.innerHTML=`<div class="badge">4 / 5　これが「わり算」</div><h1>さっきの「わける」を式にすると…</h1><p class="story">6このいちごを、3人に同じ数ずつ分けたら、ひとり2こだったね。</p><div class="equation">6 ÷ 3 = 2</div><div class="meaning"><div class="all">6<br>ぜんぶの数</div><div class="groups">3<br>分ける人数</div><div class="each">2<br>ひとり分</div></div><div class="answer-box" style="display:block"><div class="answer-main">「÷」は、おなじ数ずつ わけるしるし</div><div class="answer-sub">自分の指でやった「わけわけ」と同じことだよ。</div></div><div class="actions">${button('つぎへ →','next','next')}</div>`;bind('next',finishLearnStage)}function renderMultiplyLink(){setProgress(80);scene.innerHTML=`<div class="badge">5 / 5　かけ算と つながる</div><h1>同じ数が いくつある？</h1><p class="story">2こずつのおやつが3人分あるよ。</p><div class="party-ground">🐰 🍬🍬　🐯 🍬🍬　🐼 🍬🍬</div><div class="equation">2 × 3 = 6</div><div class="answer-box" style="display:block"><div class="answer-sub">ぜんぶ6こを、3人に戻すと…</div><div class="equation">6 ÷ 3 = 2</div><div class="answer-main">かけ算と わり算は つながってる！</div></div><div class="actions">${button('できた！','next','next')}</div>`;bind('next',finishLearnStage)}function renderLearnFinish(){setProgress(100);localStorage.setItem(learnKey,'5');scene.innerHTML=`<div class="badge">ぜんぶ クリア！</div><div style="font-size:72px">🏆</div><h1>わり算の ひみつを見つけた！</h1><p class="story">集める・分けるを、自分の手でできたね。</p><div class="actions"><a href="play.html?mode=share" style="text-decoration:none">${button('🌳 森のおやつパーティーへ','share-btn','goForest')}</a></div><div class="actions">${button('もういちど はじめから','next','again')}</div>`;bind('again',()=>{localStorage.setItem(learnKey,'0');learnStage=0;renderLearn()})}
function friendBar(extraNew=0){const unlocked=Math.max(forest.friends,extraNew);return `<div class="friend-panel"><div class="friend-title">🌳 森のなかまたち</div><div class="friend-row">${animals.map((a,i)=>{const open=i<unlocked,isNew=extraNew===i+1&&i+1>forest.friends;return `<div class="friend-chip ${open?'':'locked'} ${isNew?'new':''}">${open?a.icon:'❔'}<span class="friend-name">${open?a.name:'???'}</span></div>`}).join('')}</div></div>`}
function renderForest(){forest.step=Math.max(0,Math.min(forest.step,forestStages.length-1));saveForest();setProgress((forest.step/(forestStages.length-1))*100);const stage=forestStages[forest.step];if(stage.type==='share')startForestShare(stage);else if(stage.type==='invite')startInvite(stage);else renderPartyHome()}function startForestShare(stage){const extraPeople=Math.max(forest.friends,stage.people);state={kind:'forestShare',stage,problem:stage,remaining:stage.total,counts:Array(stage.people).fill(0),done:false};renderShareBoard({title:stage.title,intro:stage.intro,guide:stage.guide,friendExtra:extraPeople})}
function renderShareBoard(opts){const p=state.problem,badge=state.kind==='learnShare'?`${state.learnIndex+1} / 5　自分で「わける」`:`おてつだい ${forest.step+1}`,friends=state.kind==='forestShare'?friendBar(opts.friendExtra||0):'';scene.innerHTML=`${friends}<div class="badge">${badge}</div><h1>${opts.title}</h1><p class="story">${opts.intro}<br><strong>${p.total}こ → ${p.people}人</strong></p><div class="pool"><div class="pool-title">おやつ：<span id="remaining">${state.remaining}</span>こ のこってる</div><div class="pool-items" id="poolItems"></div></div><div class="people" id="people"></div><div class="feedback" id="feedback">👇 おやつをつかんで、動物のところへ！</div><div class="celebrate" id="celebrate"></div><div class="answer-box" id="shareAnswer"></div><div class="mini-note">配ったおやつの場所は点線で残るよ。最初に何こあったか、いつでも見られるよ。</div>`;renderSourceSlots();renderPeople(opts.guide)}
function renderSourceSlots(){const p=state.problem,pool=document.getElementById('poolItems');if(!pool)return;const used=p.total-state.remaining;pool.innerHTML=Array.from({length:p.total},(_,i)=>i<used?`<span class="source-slot used" aria-label="配り終わったおやつ"></span>`:`<span class="source-slot"><span class="drag-item share-drag">${p.item}</span></span>`).join('');const rem=document.getElementById('remaining');if(rem)rem.textContent=state.remaining;const handler=state.kind==='invite'?startInviteDrag:startShareDrag;document.querySelectorAll('.share-drag').forEach(el=>el.addEventListener('pointerdown',handler))}
function renderPeople(guide=false){const p=state.problem,each=p.total/p.people,el=document.getElementById('people');if(!el)return;el.innerHTML=state.counts.map((count,i)=>{const slots=Array.from({length:guide?each:Math.max(count,1)},(_,j)=>j<count?`<span class="target-slot filled">${p.item}</span>`:guide?`<span class="target-slot"></span>`:'').join('');const allEqual=state.counts.every(c=>c===count)&&count>0;let mood=count===each?'😊 ちょうど！':allEqual?'😊 おなじ！':count===0?'まだだよ':'もらったよ';return `<div class="person ${count===each?'full':''}" data-person="${i}"><div class="face">${animals[i].icon}</div><div class="person-label">${animals[i].name}</div><div class="person-items">${slots}</div><div class="count-label">${count}こ</div><div class="mood">${mood}</div></div>`}).join('')}
function startShareDrag(e){if(state.done||state.remaining<=0)return;e.preventDefault();let current=null;dragFloating(e,state.problem.item,(x,y)=>{document.querySelectorAll('.person').forEach(el=>el.classList.remove('drop-ready'));const hit=document.elementFromPoint(x,y);current=hit&&hit.closest?hit.closest('.person'):null;if(current)current.classList.add('drop-ready')},()=>{document.querySelectorAll('.person').forEach(el=>el.classList.remove('drop-ready'));if(current)giveTo(Number(current.dataset.person))})}
function giveTo(i){if(state.done||state.remaining<=0)return;const p=state.problem,each=p.total/p.people,feedback=document.getElementById('feedback');if(state.counts[i]>=each){feedback.textContent=`${animals[i].icon} ${animals[i].name}はもう${each}こ！ ほかの子にもあげてみよう。`;const card=document.querySelector(`[data-person="${i}"]`);if(card){card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),500)}return}state.counts[i]++;state.remaining--;renderSourceSlots();renderPeople(!!state.stage?.guide||state.kind==='learnShare'&&state.learnIndex===1);const equal=state.counts.every(c=>c>0&&c===state.counts[0]);feedback.textContent=state.remaining>0?(equal?'✨ いま、みんな おなじ！ このままいこう。':`${animals[i].icon}に1こ あげたよ。`):'';if(state.remaining===0)completeShare()}
function completeShare(){if(state.kind==='partyShare'){completeParty();return}state.done=true;document.getElementById('celebrate').textContent='🎉 みんな おなじ！';const p=state.problem,each=p.total/p.people;if(state.kind==='learnShare'){showShareEquation(p.total,p.people,each,()=>finishLearnStage(),'つぎへ →');return}forest.helps++;saveForest();if(state.stage.askEach)showEachQuestion(each);else showShareEquation(p.total,p.people,each,()=>finishForestStage(),'つぎのおてつだい →')}
function showEachQuestion(answer){const choices=[answer-1,answer,answer+1].filter((v,i,a)=>v>0&&a.indexOf(v)===i).sort(()=>Math.random()-.5),box=document.getElementById('shareAnswer');box.style.display='block';box.innerHTML=`<div class="answer-main">ひとり 何こずつだった？</div><div class="answer-sub">上の動物のおやつを数えてみよう。</div><div class="choice-row">${choices.map(v=>`<button class="choice" data-choice="${v}">${v}こ</button>`).join('')}</div><div class="feedback" id="choiceFeedback"></div>`;box.querySelectorAll('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>{const v=Number(btn.dataset.choice);if(v===answer){btn.classList.add('good');box.querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('choiceFeedback').textContent='✨ そう！ 見たままでOK！';box.insertAdjacentHTML('beforeend',`<div class="equation">${state.problem.total} ÷ ${state.problem.people} = ${answer}</div><div class="actions">${button('つぎのおてつだい →','next','afterQ')}</div>`);bind('afterQ',finishForestStage)}else{btn.classList.add('bad');document.getElementById('choiceFeedback').textContent='上の動物のおやつを、もう一度数えてみよう 👀'}}))}
function showShareEquation(total,people,each,nextFn,label){const box=document.getElementById('shareAnswer');box.style.display='block';box.innerHTML=`<div class="answer-main">ひとり ${each}こずつ！</div><div class="answer-sub">${total}こを${people}人に同じだけ分けたね。</div><div class="equation">${total} ÷ ${people} = ${each}</div><div class="meaning"><div class="all">${total}<br>ぜんぶ</div><div class="groups">${people}<br>人数</div><div class="each">${each}<br>ひとり分</div></div><div class="actions">${button(label,'next','afterShare')}</div>`;bind('afterShare',nextFn)}
function startInvite(stage){state={kind:'invite',stage,problem:stage,remaining:stage.total,invited:[],currentCount:0,done:false};const extra=Math.min(animals.length,Math.max(forest.friends,stage.total/stage.each));scene.innerHTML=`${friendBar(extra)}<div class="badge">おてつだい ${forest.step+1}</div><h1>${stage.title}</h1><p class="story">${stage.intro}</p><div class="invite-rule">ルール：ひとり ${stage.each}こずつ</div><div class="pool"><div class="pool-title">おやつ：<span id="remaining">${state.remaining}</span>こ のこってる</div><div class="pool-items" id="poolItems"></div></div><div class="invite-stage"><div class="invited-row" id="invitedRow"></div><div class="invite-current" id="inviteCurrent"></div></div><div class="feedback" id="feedback">👇 来たお友だちに、${stage.each}こずつあげよう！</div><div class="celebrate" id="celebrate"></div><div class="answer-box" id="shareAnswer"></div>`;renderInvite()}
function renderInvite(){renderSourceSlots();const row=document.getElementById('invitedRow'),current=document.getElementById('inviteCurrent');if(!row||!current)return;row.innerHTML=state.invited.map(aIdx=>`<div class="invited-card"><div class="face">${animals[aIdx].icon}</div><div class="person-label">${animals[aIdx].name}</div><div>${repeat(state.stage.item,state.stage.each)}</div></div>`).join('');if(state.remaining>0){const idx=state.invited.length%animals.length;current.innerHTML=`<div class="face">${animals[idx].icon}</div><div class="person-label">${animals[idx].name}が来たよ！</div><div class="person-items">${Array.from({length:state.stage.each},(_,j)=>j<state.currentCount?`<span class="target-slot filled">${state.stage.item}</span>`:`<span class="target-slot"></span>`).join('')}</div><div class="count-label">${state.currentCount}/${state.stage.each}こ</div>`}else current.innerHTML=''}
function startInviteDrag(e){if(state.done||state.remaining<=0)return;e.preventDefault();let over=false;const target=document.getElementById('inviteCurrent');dragFloating(e,state.stage.item,(x,y)=>{const hit=document.elementFromPoint(x,y);over=!!(hit&&(hit===target||hit.closest?.('#inviteCurrent')));target.classList.toggle('drop-ready',over)},()=>{target.classList.remove('drop-ready');if(over)giveInvite()})}
function giveInvite(){if(state.done||state.remaining<=0)return;state.currentCount++;state.remaining--;const idx=state.invited.length%animals.length;document.getElementById('feedback').textContent=`${animals[idx].icon}に1こ！ あと${state.stage.each-state.currentCount}こ。`;if(state.currentCount===state.stage.each){state.invited.push(idx);state.currentCount=0;document.getElementById('feedback').textContent=`✨ ${animals[idx].name}も来られた！ 次のお友だちは？`}renderInvite();if(state.remaining===0){state.done=true;forest.helps++;saveForest();document.getElementById('celebrate').textContent=`🎉 ${state.invited.length}人 よべた！`;const box=document.getElementById('shareAnswer');box.style.display='block';box.innerHTML=`<div class="answer-main">${state.invited.length}人 よべた！</div><div class="answer-sub">${state.stage.total}こを、ひとり${state.stage.each}こずつ配ったね。</div><div class="equation">${state.stage.total} ÷ ${state.stage.each} = ${state.invited.length}</div><div class="meaning"><div class="all">${state.stage.total}<br>ぜんぶ</div><div class="each">${state.stage.each}<br>ひとり分</div><div class="groups">${state.invited.length}<br>よべた人数</div></div><div class="actions">${button('つぎのおてつだい →','next','afterInvite')}</div>`;bind('afterInvite',finishForestStage)}}
function finishForestStage(){const justFinished=forest.step,unlock=unlockAfter[justFinished];forest.step=Math.min(forest.step+1,forestStages.length-1);saveForest();if(unlock&&forest.friends<unlock)renderArrival(unlock-1);else renderForest()}function renderArrival(animalIndex){setProgress((forest.step/(forestStages.length-1))*100);const a=animals[animalIndex];scene.innerHTML=`${friendBar(animalIndex+1)}<div class="arrival"><div class="badge">あたらしい なかま！</div><div class="arrival-face">${a.icon}</div><h1>${a.name}が あそびにきた！</h1><p class="story">おやつを上手にわけられたから、森のお友だちが増えたよ。</p><div class="actions">${button('いっしょに あそぶ！','next','join')}</div></div>`;bind('join',()=>{forest.friends=Math.max(forest.friends,animalIndex+1);saveForest();renderForest()})}
function renderPartyHome(){forest.friends=5;saveForest();setProgress(100);const decorations=['🌼','🎈','🌸','🎂','🎊'],decor=decorations.slice(0,Math.min(decorations.length,Math.max(1,forest.partyWins+1))).join(' ');scene.innerHTML=`${friendBar()}<div class="badge">森のパーティー</div><h1>みんな そろった！</h1><div class="party-ground"><div>${animals.map(a=>a.icon).join(' ')}</div><div class="party-decor">${decor}</div></div><p class="story">好きなおやつを何回でもわけよう。<br>お手伝いするほど、広場がにぎやかになるよ。</p><div class="actions">${button('🍪 おやつを わける','share-btn','partyPlay')}</div><div class="mini-note">おてつだい：${forest.helps}かい　🎉 パーティー成功：${forest.partyWins}かい</div>`;bind('partyPlay',startPartyRound)}
function startPartyRound(){const pool=[{total:4,people:2,item:'🍪'},{total:6,people:2,item:'🍓'},{total:6,people:3,item:'🍬'},{total:8,people:2,item:'🧁'},{total:8,people:4,item:'🍎'},{total:9,people:3,item:'🍇'}],p=pool[Math.floor(Math.random()*pool.length)];state={kind:'partyShare',stage:p,problem:p,remaining:p.total,counts:Array(p.people).fill(0),done:false};scene.innerHTML=`${friendBar()}<div class="badge">森のパーティー</div><h1>${p.item}を みんなに わけよう</h1><p class="story">${p.total}こを${p.people}人に、同じだけ配ってね。</p><div class="pool"><div class="pool-title">おやつ：<span id="remaining">${state.remaining}</span>こ のこってる</div><div class="pool-items" id="poolItems"></div></div><div class="people" id="people"></div><div class="feedback" id="feedback">👇 手で配ってみよう！</div><div class="celebrate" id="celebrate"></div><div class="answer-box" id="shareAnswer"></div>`;renderSourceSlots();renderPeople(false)}function completeParty(){state.done=true;forest.helps++;forest.partyWins++;saveForest();document.getElementById('celebrate').textContent='🎊 パーティー大成功！';const p=state.problem,each=p.total/p.people,box=document.getElementById('shareAnswer');box.style.display='block';box.innerHTML=`<div class="answer-main">${each}こずつ！</div><div class="equation">${p.total} ÷ ${p.people} = ${each}</div><div class="actions">${button('広場にもどる','next','partyBack')} ${button('もう1回！','share-btn','partyAgain')}</div>`;bind('partyBack',renderPartyHome);bind('partyAgain',startPartyRound)}
function dragFloating(e,icon,onMove,onDrop){const source=e.currentTarget,pointerId=e.pointerId;try{source.setPointerCapture(pointerId)}catch(err){}source.style.opacity='.2';const ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=icon;document.body.appendChild(ghost);move(e);function move(ev){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';onMove(ev.clientX,ev.clientY)}function cleanup(){ghost.remove();source.style.opacity='1';source.removeEventListener('pointermove',move);source.removeEventListener('pointerup',up);source.removeEventListener('pointercancel',cancel)}function up(){cleanup();onDrop()}function cancel(){cleanup();onMove(-9999,-9999)}source.addEventListener('pointermove',move);source.addEventListener('pointerup',up);source.addEventListener('pointercancel',cancel)}function dragElement(e,icon,target,onEnter,onLeave,onDrop){let over=false;dragFloating(e,icon,(x,y)=>{const hit=document.elementFromPoint(x,y),now=!!(hit&&(hit===target||hit.closest?.('#'+target.id)));if(now&&!over)onEnter();if(!now&&over)onLeave();over=now},()=>{onLeave();if(over)onDrop()})}
if(mode==='share')renderForest();else if(Number(localStorage.getItem(learnKey)||0)>=5)renderLearnFinish();else renderLearn();
</script>
