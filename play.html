<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わけわけランド</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#eefbff,#fffaf0);min-height:100vh;color:#263238}
  .wrap{width:min(760px,95%);margin:0 auto;padding:14px 0 36px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .back{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#fff;color:#475569;text-decoration:none;font-size:28px;font-weight:900;box-shadow:0 6px 18px rgba(30,41,59,.1)}
  .top-title{font-weight:900;font-size:20px;flex:1;text-align:center;padding-right:48px}
  .progress{height:12px;background:#dfe8ef;border-radius:999px;overflow:hidden;margin-bottom:12px}
  .progress>div{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#38bdf8);transition:width .3s}
  .card{background:rgba(255,255,255,.97);border-radius:28px;padding:22px;box-shadow:0 16px 40px rgba(40,64,84,.12);margin-bottom:14px}
  .scene{text-align:center}
  .badge{display:inline-block;border-radius:999px;padding:7px 13px;background:#f1f5f9;color:#64748b;font-weight:900;font-size:13px;margin-bottom:7px}
  h1{font-size:clamp(25px,7vw,36px);margin:7px 0 9px}
  .story{font-size:clamp(17px,4.5vw,21px);color:#52606d;line-height:1.7;margin:0 auto 18px;max-width:600px;font-weight:700}
  .big-items{font-size:clamp(35px,10vw,55px);line-height:1.45;letter-spacing:4px;min-height:80px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px}
  .plus{font-size:42px;font-weight:900;color:#94a3b8;margin:0 10px}
  .answer-box{margin:15px auto 0;background:#f0fdf4;border:3px solid #86efac;border-radius:20px;padding:16px;max-width:600px;display:none}
  .answer-main{font-size:clamp(28px,8vw,42px);font-weight:900;color:#166534}
  .answer-sub{font-size:16px;color:#3f6b4c;font-weight:750;line-height:1.7;margin-top:8px}
  .people{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px auto;max-width:650px}
  .person{min-width:112px;flex:1 1 112px;max-width:150px;background:#f8fafc;border:3px solid #cbd5e1;border-radius:20px;padding:11px 8px;min-height:150px}
  .face{font-size:43px;margin-bottom:4px}
  .person-label{font-size:12px;color:#64748b;font-weight:800}
  .person-items{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;font-size:27px;line-height:1.25;min-height:36px;margin-top:5px}
  .pool{background:#fff7ed;border:3px dashed #fdba74;border-radius:20px;padding:12px;margin:10px auto 14px;max-width:620px}
  .pool-title{font-weight:900;color:#9a3412;margin-bottom:5px}
  .pool-items{font-size:30px;line-height:1.4;min-height:42px;word-break:break-all}
  .equation{font-size:clamp(31px,9vw,48px);font-weight:950;letter-spacing:.03em;margin:10px 0;color:#4338ca}
  .meaning{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .meaning>div{border-radius:15px;padding:11px 6px;font-weight:850;font-size:14px;line-height:1.45}
  .meaning .all{background:#fff7ed;color:#9a3412}.meaning .groups{background:#eff6ff;color:#1d4ed8}.meaning .each{background:#f0fdf4;color:#166534}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  button{border:0;border-radius:18px;padding:15px 20px;font-size:18px;font-weight:900;cursor:pointer;min-height:56px}
  button:active{transform:scale(.98)}
  .primary{background:#4f46e5;color:#fff;box-shadow:0 8px 18px rgba(79,70,229,.24)}
  .share-btn{background:#0ea5e9;color:#fff;box-shadow:0 8px 18px rgba(14,165,233,.22);font-size:20px}
  .next{background:#16a34a;color:#fff}
  .soft{background:#e2e8f0;color:#475569}
  .celebrate{font-size:40px;min-height:50px;margin:8px 0 0}
  .mini-note{font-size:14px;color:#64748b;font-weight:700;line-height:1.6;margin-top:10px}
  .groups-demo{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0}
  .group-demo{background:#f5f3ff;border:3px solid #c4b5fd;border-radius:18px;padding:12px;min-width:105px;font-size:29px}
  .group-demo small{display:block;font-size:12px;font-weight:900;color:#6d28d9;margin-bottom:5px}
  @media(max-width:520px){.card{padding:17px}.person{min-width:92px;flex-basis:92px;min-height:135px}.face{font-size:36px}.person-items{font-size:24px}.meaning{grid-template-columns:1fr}.top-title{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="index.html">‹</a><div class="top-title" id="topTitle">はじめから</div></div>
  <div class="progress"><div id="bar"></div></div>
  <main class="card scene" id="scene"></main>
</div>
<script>
const params=new URLSearchParams(location.search);
const mode=params.get('mode')==='share'?'share':'learn';
const scene=document.getElementById('scene');
const bar=document.getElementById('bar');
document.getElementById('topTitle').textContent=mode==='share'?'🍬 わけわけゲーム':'🌟 はじめから';

const icons=['🐰','🐶','🐱','🐼','🦊'];
const shareProblems=[
  {total:4,people:2,item:'🍪'},{total:6,people:2,item:'🍓'},{total:6,people:3,item:'🍬'},
  {total:8,people:4,item:'🍎'},{total:8,people:2,item:'🧁'},{total:9,people:3,item:'🍇'},
  {total:10,people:5,item:'⭐'},{total:10,people:2,item:'🍒'},{total:12,people:3,item:'🥕'},{total:12,people:4,item:'🍩'}
];
let learnStage=Math.min(Number(localStorage.getItem('warizanLearnStage')||0),4);
let state={};

function repeat(icon,n){return Array.from({length:n},()=>icon).join('');}
function button(label,cls='primary',id='action'){return `<button class="${cls}" id="${id}">${label}</button>`;}
function bind(id,fn){const el=document.getElementById(id);if(el)el.addEventListener('click',fn);}
function setProgress(value){bar.style.width=`${Math.max(0,Math.min(100,value))}%`;}

function renderLearn(){
  const stage=learnStage;
  setProgress((stage/5)*100);
  if(stage===0)renderAdd();
  else if(stage===1)startShare({total:4,people:2,item:'🍪'},true,1);
  else if(stage===2)startShare({total:6,people:3,item:'🍓'},true,2);
  else if(stage===3)renderEquationMeaning();
  else renderMultiplyLink();
}

function finishLearnStage(){
  learnStage++;
  localStorage.setItem('warizanLearnStage',String(Math.min(learnStage,5)));
  if(learnStage>=5){renderLearnFinish();return;}
  renderLearn();
}

function renderAdd(){
  scene.innerHTML=`
    <div class="badge">1 / 5　まずは「ぜんぶ」を見る</div>
    <h1>りんごを いっしょにしよう</h1>
    <p class="story">3こ と 2こ。べつべつにあるけど、いっしょにしたら ぜんぶで なんこかな？</p>
    <div class="big-items"><span>🍎🍎🍎</span><span class="plus">＋</span><span>🍎🍎</span></div>
    <div class="actions">${button('いっしょにする！','primary','merge')}</div>
    <div class="answer-box" id="answer"><div class="big-items">🍎🍎🍎🍎🍎</div><div class="answer-main">ぜんぶで 5こ！</div><div class="answer-sub">3こ ＋ 2こ ＝ 5こ。<br>まず「ぜんぶの数」が分かればOK！</div><div class="actions">${button('つぎへ →','next','next')}</div></div>`;
  bind('merge',()=>{document.getElementById('answer').style.display='block';document.getElementById('merge').style.display='none';});
  bind('next',finishLearnStage);
}

function startShare(problem,isLearn=false,learnIndex=0){
  state={problem,isLearn,learnIndex,remaining:problem.total,counts:Array(problem.people).fill(0),done:false};
  renderShareScene();
}

function renderShareScene(){
  const p=state.problem;
  const badge=state.isLearn?`${state.learnIndex+1} / 5　「同じだけ」を体験`:'わけわけゲーム';
  const title=state.isLearn?(state.learnIndex===1?'ケンカしないように わけよう':'みんなに おなじだけ！'):`${p.item}を みんなに わけよう`;
  scene.innerHTML=`
    <div class="badge">${badge}</div>
    <h1>${title}</h1>
    <p class="story">${p.total}こを ${p.people}人に、<strong>おなじ数ずつ</strong> あげてみよう。<br>「1こずつ くばる」を押してね。</p>
    <div class="pool"><div class="pool-title">まだ のこっているよ： <span id="remaining">${state.remaining}</span>こ</div><div class="pool-items" id="poolItems">${repeat(p.item,state.remaining)}</div></div>
    <div class="people" id="people"></div>
    <div class="celebrate" id="celebrate"></div>
    <div class="actions"><button class="share-btn" id="deal">👋 1こずつ くばる</button></div>
    <div class="answer-box" id="shareAnswer"></div>
    <div class="mini-note">わからなくても、ボタンを押して配ればだいじょうぶ。計算はあとから出てくるよ。</div>`;
  renderPeople();
  bind('deal',dealRound);
}

function renderPeople(){
  const p=state.problem;
  const el=document.getElementById('people');
  el.innerHTML=state.counts.map((count,i)=>`<div class="person"><div class="face">${icons[i]}</div><div class="person-label">${i+1}人め</div><div class="person-items">${repeat(p.item,count) || '　'}</div><div class="person-label">${count}こ</div></div>`).join('');
  document.getElementById('remaining').textContent=state.remaining;
  document.getElementById('poolItems').textContent=repeat(p.item,state.remaining) || 'ぜんぶ くばれた！';
}

function dealRound(){
  if(state.done)return;
  const p=state.problem;
  if(state.remaining<p.people)return;
  for(let i=0;i<p.people;i++)state.counts[i]++;
  state.remaining-=p.people;
  renderPeople();
  if(state.remaining===0){
    state.done=true;
    document.getElementById('deal').style.display='none';
    document.getElementById('celebrate').textContent='🎉 みんな おなじ！';
    const each=p.total/p.people;
    const ans=document.getElementById('shareAnswer');
    ans.style.display='block';
    ans.innerHTML=`<div class="answer-main">ひとり ${each}こずつ！</div>
      <div class="answer-sub">${p.total}こを ${p.people}人に同じ数ずつ分けたら、ひとり ${each}こになったね。</div>
      <div class="equation">${p.total} ÷ ${p.people} = ${each}</div>
      <div class="meaning"><div class="all">${p.total}<br>ぜんぶの数</div><div class="groups">${p.people}<br>分ける人数</div><div class="each">${each}<br>ひとり分</div></div>
      <div class="actions">${button(state.isLearn?'つぎへ →':'もう1回！','next','afterShare')}</div>`;
    bind('afterShare',()=>{
      if(state.isLearn)finishLearnStage();
      else{const s=Number(localStorage.getItem('warizanShareStars')||0)+1;localStorage.setItem('warizanShareStars',String(s));startRandomShare();}
    });
  }
}

function renderEquationMeaning(){
  setProgress(60);
  scene.innerHTML=`
    <div class="badge">4 / 5　これが「わり算」</div>
    <h1>さっきの「わける」を式にすると…</h1>
    <p class="story">6このいちごを、3人に同じ数ずつ分けたら、ひとり2こだったね。</p>
    <div class="equation">6 ÷ 3 = 2</div>
    <div class="meaning"><div class="all">6<br>ぜんぶの数</div><div class="groups">3<br>分ける人数</div><div class="each">2<br>ひとり分</div></div>
    <div class="answer-box" style="display:block;margin-top:18px"><div class="answer-main">「÷」は、おなじ数ずつ わけるしるし</div><div class="answer-sub">むずかしい記号に見えるけど、さっき自分でやった「わけわけ」と同じことだよ。</div></div>
    <div class="actions">${button('つぎへ →','next','next')}</div>`;
  bind('next',finishLearnStage);
}

function renderMultiplyLink(){
  setProgress(80);
  scene.innerHTML=`
    <div class="badge">5 / 5　かけ算と つながる</div>
    <h1>かけ算を うしろから見ると？</h1>
    <p class="story">2こずつのグループが3つあるよ。ぜんぶで何こになるかな。</p>
    <div class="groups-demo"><div class="group-demo"><small>1グループ</small>🍬🍬</div><div class="group-demo"><small>2グループ</small>🍬🍬</div><div class="group-demo"><small>3グループ</small>🍬🍬</div></div>
    <div class="equation">2 × 3 = 6</div>
    <div class="answer-box" style="display:block"><div class="answer-sub">ぜんぶ6こを、3グループに戻すと…</div><div class="equation">6 ÷ 3 = 2</div><div class="answer-main">わり算は、かけ算の「ぎゃく」みたい！</div></div>
    <div class="actions">${button('できた！','next','next')}</div>`;
  bind('next',finishLearnStage);
}

function renderLearnFinish(){
  setProgress(100);
  localStorage.setItem('warizanLearnStage','5');
  scene.innerHTML=`
    <div class="badge">ぜんぶ クリア！</div>
    <div style="font-size:72px">🏆</div>
    <h1>わり算の ひみつを見つけた！</h1>
    <p class="story">「ぜんぶの数」を「同じ数ずつ分ける」と、ひとり分が分かる。これがわり算だよ。</p>
    <div class="answer-box" style="display:block"><div class="answer-main">6 ÷ 3 = 2</div><div class="answer-sub">もう記号だけ見ても、さっき配ったいちごを思い出せるね。</div></div>
    <div class="actions"><a href="play.html?mode=share" style="text-decoration:none">${button('🍬 わけわけゲームへ','share-btn','dummy1')}</a><a href="challenge.html" style="text-decoration:none">${button('➗ 5問チャレンジ','primary','dummy2')}</a></div>`;
}

function startRandomShare(){
  setProgress(100);
  let last=Number(sessionStorage.getItem('lastShareProblem')||-1),idx;
  do{idx=Math.floor(Math.random()*shareProblems.length)}while(shareProblems.length>1&&idx===last);
  sessionStorage.setItem('lastShareProblem',String(idx));
  startShare(shareProblems[idx],false,0);
}

if(mode==='share')startRandomShare();else if(Number(localStorage.getItem('warizanLearnStage')||0)>=5)renderLearnFinish();else renderLearn();
</script>
</body>
</html>
