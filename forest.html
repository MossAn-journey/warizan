<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>森のおやつパーティー</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#eefbff,#fffaf0);min-height:100vh;color:#263238}.wrap{width:min(760px,95%);margin:auto;padding:14px 0 36px}.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.back{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#fff;color:#475569;text-decoration:none;font-size:28px;font-weight:900;box-shadow:0 6px 18px #1e293b1a}.title{font-weight:900;font-size:20px;flex:1;text-align:center;padding-right:48px}.progress{height:12px;background:#dfe8ef;border-radius:999px;overflow:hidden;margin-bottom:12px}.progress>div{height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8);transition:.3s}.card{background:#fffffff7;border-radius:28px;padding:20px;box-shadow:0 16px 40px #2840541f;text-align:center}.badge{display:inline-block;border-radius:999px;padding:7px 13px;background:#f1f5f9;color:#64748b;font-weight:900;font-size:13px}h1{font-size:clamp(25px,7vw,36px);margin:8px}.story{font-size:clamp(17px,4.5vw,21px);color:#52606d;line-height:1.7;font-weight:700}.friends{background:#fff;border:2px solid #e2e8f0;border-radius:20px;padding:10px;margin-bottom:13px}.friend-row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.friend{min-width:45px;padding:6px;border-radius:13px;background:#f1f5f9;border:2px solid #e2e8f0;font-size:23px}.friend.locked{filter:grayscale(1);opacity:.3}.friend.new{border-color:#fbbf24;background:#fffbeb;animation:pop .7s ease-in-out infinite alternate}.friend small{display:block;font-size:9px;font-weight:900;color:#64748b}@keyframes pop{to{transform:translateY(-3px) scale(1.05)}}.pool{background:#fff7ed;border:3px solid #fdba74;border-radius:22px;padding:12px;margin:10px auto;max-width:650px}.pool-title{font-weight:900;color:#9a3412;margin-bottom:8px}.pool-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,52px));justify-content:center;gap:7px}.slot{width:52px;height:52px;display:grid;place-items:center;border-radius:14px}.slot.used{border:3px dashed #d7b48e;background:#ffffff59}.slot.used:after{content:"";width:18px;height:18px;border:2px dashed #d7b48e;border-radius:50%}.drag{width:52px;height:52px;display:grid;place-items:center;background:#fff;border-radius:14px;font-size:33px;box-shadow:0 5px 12px #7c4a142b;touch-action:none;user-select:none}.ghost{position:fixed;z-index:9999;width:62px;height:62px;display:grid;place-items:center;font-size:42px;background:#fff;border:3px solid #38bdf8;border-radius:18px;box-shadow:0 12px 28px #0f172a40;pointer-events:none;transform:translate(-50%,-50%) rotate(-5deg)}.people{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:12px auto}.person{min-width:105px;flex:1 1 105px;max-width:150px;background:#f8fafc;border:3px solid #cbd5e1;border-radius:20px;padding:9px;min-height:165px;transition:.15s}.person.over,.invite.over{border-color:#38bdf8;background:#effaff;transform:scale(1.03)}.person.full{border-color:#86efac;background:#f0fdf4}.face{font-size:40px}.name{font-size:12px;color:#64748b;font-weight:900}.items{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;min-height:48px;margin:7px 0}.target{width:32px;height:32px;border:2px dashed #cbd5e1;border-radius:50%;display:grid;place-items:center;font-size:21px;background:#fff}.target.filled{border-style:solid;border-color:#86efac}.count{font-weight:900;color:#475569}.mood{font-size:12px;font-weight:900;color:#64748b;min-height:20px}.feedback{min-height:34px;font-size:17px;font-weight:900;color:#0369a1;margin:8px}.celebrate{font-size:38px;min-height:45px}.answer{display:none;margin-top:12px;background:#f0fdf4;border:3px solid #86efac;border-radius:20px;padding:15px}.answer-main{font-size:30px;font-weight:900;color:#166534}.equation{font-size:clamp(30px,8vw,46px);font-weight:950;color:#4338ca;margin:10px}.meaning{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.meaning div{padding:10px;border-radius:14px;font-weight:900}.meaning .all{background:#fff7ed;color:#9a3412}.meaning .groups{background:#eff6ff;color:#1d4ed8}.meaning .each{background:#f0fdf4;color:#166534}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:17px;padding:14px 18px;min-height:54px;font-size:17px;font-weight:900}.next{background:#16a34a;color:white}.share{background:#0ea5e9;color:white}.choice{background:#fff;border:3px solid #93c5fd;color:#1d4ed8;min-width:76px;font-size:22px}.invite-wrap{max-width:650px;margin:auto}.rule{display:inline-block;background:#fef3c7;border:2px solid #fcd34d;border-radius:16px;padding:8px 13px;font-weight:900;color:#92400e}.invited{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:10px}.invited-card{width:84px;background:#f0fdf4;border:2px solid #86efac;border-radius:16px;padding:7px}.invite{max-width:210px;margin:auto;background:#f8fafc;border:4px dashed #94a3b8;border-radius:22px;padding:11px;transition:.15s}.arrival .face{font-size:90px;animation:arrive .5s}@keyframes arrive{from{transform:translateY(25px) scale(.5);opacity:0}}.party{font-size:34px;line-height:1.9;background:linear-gradient(#eff6ff,#ecfccb);border-radius:22px;padding:14px;margin:12px}.decor{font-size:27px;letter-spacing:4px}.note{font-size:13px;color:#64748b;font-weight:700;line-height:1.6}@media(max-width:520px){.card{padding:15px}.person{min-width:90px;flex-basis:90px}.friend{min-width:40px;font-size:20px;padding:5px}.drag,.slot{width:47px;height:47px}.drag{font-size:30px}.pool-items{grid-template-columns:repeat(auto-fit,minmax(43px,47px))}.meaning{grid-template-columns:1fr}.party{font-size:28px}}
</style>
</head><body><div class="wrap"><div class="top"><a class="back" href="index.html">‹</a><div class="title">🌳 森のおやつパーティー</div></div><div class="progress"><div id="bar"></div></div><main class="card" id="scene"></main></div>
<script>
const scene=document.getElementById('scene'),bar=document.getElementById('bar'),key='warizanForestPartyV1';
const animals=[{icon:'🐰',name:'うさぎ'},{icon:'🐯',name:'とら'},{icon:'🐼',name:'ぱんだ'},{icon:'🦊',name:'きつね'},{icon:'🐻',name:'くま'},{icon:'🐶',name:'いぬ'},{icon:'🐱',name:'ねこ'},{icon:'🦁',name:'ライオン'}];
const stages=[{type:'share',title:'クッキーを わけよう',total:4,people:2,item:'🍪',guide:true,intro:'さいしょは4こだけ。ふたりに同じだけ配ろう。'},{type:'share',title:'いちごを わけよう',total:6,people:2,item:'🍓',intro:'こんどは6こ。配った場所は点線で残るよ。'},{type:'share',title:'3人で わけよう',total:6,people:3,item:'🍬',intro:'6こを3人に同じだけ配ろう。'},{type:'share',title:'ひとり何こ？',total:8,people:2,item:'🧁',ask:true,intro:'配り終わったら、ひとり分も見てみよう。'},{type:'share',title:'4人で わけよう',total:8,people:4,item:'🍎',ask:true,intro:'4人に同じだけ配ってみよう。'},{type:'invite',title:'何人よべるかな？',total:6,each:2,item:'🍪',intro:'ひとり2こずつなら、何人よべるかな？'},{type:'invite',title:'もっと よんでみよう',total:8,each:2,item:'🍓',intro:'8こを、ひとり2こずつ配ろう。'},{type:'share',title:'3人のおやつ会',total:9,people:3,item:'🍇',ask:true,intro:'少しだけ数が増えるよ。でも3人に配るだけ。'},{type:'share',title:'森のみんなで',total:10,people:5,item:'🍩',ask:true,intro:'まずは5人に同じだけ。できたら最後の仲間が来るよ！'},{type:'party'}];
const unlock={0:2,1:3,2:4,4:5,6:6,7:7,8:8};let forest=load(),state={};
function load(){try{let v=JSON.parse(localStorage.getItem(key)||'null');if(v)return{step:v.step||0,friends:v.friends||1,helps:v.helps||0,partyWins:v.partyWins||0}}catch(e){}return{step:0,friends:1,helps:0,partyWins:0}}function save(){localStorage.setItem(key,JSON.stringify(forest))}function btn(t,c='next',id='go'){return `<button class="${c}" id="${id}">${t}</button>`}function bind(id,fn){let e=document.getElementById(id);if(e)e.onclick=fn}function progress(){bar.style.width=`${forest.step/(stages.length-1)*100}%`}function friendBar(extra=0){let n=Math.max(forest.friends,extra);return `<div class="friends"><b>🌳 森のなかまたち</b><div class="friend-row">${animals.map((a,i)=>`<div class="friend ${i<n?'':'locked'} ${extra===i+1&&i+1>forest.friends?'new':''}">${i<n?a.icon:'❔'}<small>${i<n?a.name:'???'}</small></div>`).join('')}</div></div>`}
function render(){forest.step=Math.max(0,Math.min(forest.step,stages.length-1));if(forest.step>=stages.length-1)forest.friends=animals.length;save();progress();let s=stages[forest.step];if(s.type==='share')startShare(s);else if(s.type==='invite')startInvite(s);else partyHome()}
function startShare(s){state={kind:'share',stage:s,remaining:s.total,counts:Array(s.people).fill(0),done:false};scene.innerHTML=`${friendBar(Math.max(forest.friends,s.people))}<div class="badge">おてつだい ${forest.step+1}</div><h1>${s.title}</h1><p class="story">${s.intro}<br><strong>${s.total}こ → ${s.people}人</strong></p><div class="pool"><div class="pool-title">おやつ：<span id="remaining"></span>こ のこってる</div><div class="pool-items" id="pool"></div></div><div class="people" id="people"></div><div class="feedback" id="feedback">👇 おやつをつかんで、動物のところへ！</div><div class="celebrate" id="celebrate"></div><div class="answer" id="answer"></div><div class="note">配った場所は点線で残るよ。最初に何こあったか見失わないよ。</div>`;drawSource();drawPeople()}
function drawSource(){let s=state.stage,used=s.total-state.remaining,p=document.getElementById('pool');p.innerHTML=Array.from({length:s.total},(_,i)=>i<used?'<span class="slot used"></span>':`<span class="slot"><span class="drag">${s.item}</span></span>`).join('');document.getElementById('remaining').textContent=state.remaining;document.querySelectorAll('.drag').forEach(e=>e.onpointerdown=startDrag)}
function drawPeople(){let s=state.stage,each=s.total/s.people,el=document.getElementById('people');el.innerHTML=state.counts.map((c,i)=>{let slots=Array.from({length:s.guide?each:Math.max(c,1)},(_,j)=>j<c?`<span class="target filled">${s.item}</span>`:s.guide?'<span class="target"></span>':'').join(''),eq=state.counts.every(x=>x===c)&&c>0,mood=c===each?'😊 ちょうど！':eq?'😊 おなじ！':c?'もらったよ':'まだだよ';return `<div class="person ${c===each?'full':''}" data-i="${i}"><div class="face">${animals[i].icon}</div><div class="name">${animals[i].name}</div><div class="items">${slots}</div><div class="count">${c}こ</div><div class="mood">${mood}</div></div>`}).join('')}
function startDrag(e){if(state.done)return;e.preventDefault();let target=null;floatDrag(e,state.stage.item,(x,y)=>{document.querySelectorAll('.person').forEach(p=>p.classList.remove('over'));let h=document.elementFromPoint(x,y);target=h?.closest?.('.person')||null;if(target)target.classList.add('over')},()=>{document.querySelectorAll('.person').forEach(p=>p.classList.remove('over'));if(target)give(Number(target.dataset.i))})}
function give(i){let s=state.stage,each=s.total/s.people,f=document.getElementById('feedback');if(state.counts[i]>=each){f.textContent=`${animals[i].icon}はもう${each}こ！ ほかの子にもあげよう。`;return}state.counts[i]++;state.remaining--;drawSource();drawPeople();let equal=state.counts.every(c=>c>0&&c===state.counts[0]);f.textContent=state.remaining?(equal?'✨ いま、みんな おなじ！':`${animals[i].icon}に1こ あげたよ。`):'';if(!state.remaining)finishShare()}
function finishShare(){if(state.kind==='party'){state.done=true;forest.helps++;forest.partyWins++;save();document.getElementById('celebrate').textContent='🎊 パーティー大成功！';let s=state.stage,e=s.total/s.people,b=document.getElementById('answer');b.style.display='block';b.innerHTML=`<div class="equation">${s.total} ÷ ${s.people} = ${e}</div><div class="actions">${btn('広場へ','next','home')} ${btn('もう1回！','share','again')}</div>`;bind('home',partyHome);bind('again',partyRound);return}state.done=true;forest.helps++;save();document.getElementById('celebrate').textContent='🎉 みんな おなじ！';let s=state.stage,each=s.total/s.people;if(s.ask)askEach(each);else showAnswer(each)}
function askEach(ans){let box=document.getElementById('answer'),cs=[ans-1,ans,ans+1].filter(x=>x>0).sort(()=>Math.random()-.5);box.style.display='block';box.innerHTML=`<div class="answer-main">ひとり 何こずつだった？</div><div class="actions">${cs.map(x=>`<button class="choice" data-v="${x}">${x}こ</button>`).join('')}</div><div id="qmsg" class="feedback"></div>`;box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(Number(b.dataset.v)===ans){document.getElementById('qmsg').textContent='✨ そう！';box.insertAdjacentHTML('beforeend',`<div class="equation">${state.stage.total} ÷ ${state.stage.people} = ${ans}</div><div class="actions">${btn('つぎへ →','next','after')}</div>`);box.querySelectorAll('.choice').forEach(x=>x.disabled=true);bind('after',advance)}else document.getElementById('qmsg').textContent='上のおやつを数えてみよう 👀'})}
function showAnswer(each){let s=state.stage,box=document.getElementById('answer');box.style.display='block';box.innerHTML=`<div class="answer-main">ひとり ${each}こずつ！</div><div class="equation">${s.total} ÷ ${s.people} = ${each}</div><div class="meaning"><div class="all">${s.total}<br>ぜんぶ</div><div class="groups">${s.people}<br>人数</div><div class="each">${each}<br>ひとり分</div></div><div class="actions">${btn('つぎへ →','next','after')}</div>`;bind('after',advance)}
function startInvite(s){state={kind:'invite',stage:s,remaining:s.total,invited:[],current:0,done:false};scene.innerHTML=`${friendBar(Math.max(forest.friends,s.total/s.each))}<div class="badge">おてつだい ${forest.step+1}</div><h1>${s.title}</h1><p class="story">${s.intro}</p><div class="rule">ひとり ${s.each}こずつ</div><div class="pool"><div class="pool-title">おやつ：<span id="remaining"></span>こ のこってる</div><div class="pool-items" id="pool"></div></div><div class="invite-wrap"><div class="invited" id="invited"></div><div class="invite" id="invite"></div></div><div class="feedback" id="feedback">👇 来た子に${s.each}こずつあげよう！</div><div class="celebrate" id="celebrate"></div><div class="answer" id="answer"></div>`;drawInvite()}
function drawInvite(){let s=state.stage,used=s.total-state.remaining,p=document.getElementById('pool');p.innerHTML=Array.from({length:s.total},(_,i)=>i<used?'<span class="slot used"></span>':`<span class="slot"><span class="drag">${s.item}</span></span>`).join('');document.getElementById('remaining').textContent=state.remaining;document.querySelectorAll('.drag').forEach(e=>e.onpointerdown=inviteDrag);document.getElementById('invited').innerHTML=state.invited.map(i=>`<div class="invited-card"><div class="face">${animals[i].icon}</div><div class="name">${animals[i].name}</div><div>${s.item.repeat(s.each)}</div></div>`).join('');let cur=document.getElementById('invite');if(state.remaining){let i=state.invited.length%animals.length;cur.innerHTML=`<div class="face">${animals[i].icon}</div><div class="name">${animals[i].name}が来たよ！</div><div class="items">${Array.from({length:s.each},(_,j)=>j<state.current?`<span class="target filled">${s.item}</span>`:'<span class="target"></span>').join('')}</div><div class="count">${state.current}/${s.each}こ</div>`}else cur.innerHTML=''}
function inviteDrag(e){e.preventDefault();let over=false,t=document.getElementById('invite');floatDrag(e,state.stage.item,(x,y)=>{let h=document.elementFromPoint(x,y);over=!!(h&&(h===t||h.closest?.('#invite')));t.classList.toggle('over',over)},()=>{t.classList.remove('over');if(over)giveInvite()})}
function giveInvite(){let s=state.stage,i=state.invited.length%animals.length;state.current++;state.remaining--;document.getElementById('feedback').textContent=`${animals[i].icon}に1こ！`;if(state.current===s.each){state.invited.push(i);state.current=0;document.getElementById('feedback').textContent=`✨ ${animals[i].name}も来られた！`}drawInvite();if(!state.remaining){state.done=true;forest.helps++;save();document.getElementById('celebrate').textContent=`🎉 ${state.invited.length}人 よべた！`;let b=document.getElementById('answer');b.style.display='block';b.innerHTML=`<div class="answer-main">${state.invited.length}人 よべた！</div><div class="equation">${s.total} ÷ ${s.each} = ${state.invited.length}</div><div class="actions">${btn('つぎへ →','next','after')}</div>`;bind('after',advance)}}
function advance(){let done=forest.step,n=unlock[done];forest.step=Math.min(forest.step+1,stages.length-1);save();if(n&&forest.friends<n)arrival(n-1);else render()}
function arrival(i){progress();let a=animals[i];scene.innerHTML=`${friendBar(i+1)}<div class="arrival"><div class="badge">あたらしい なかま！</div><div class="face">${a.icon}</div><h1>${a.name}が あそびにきた！</h1><p class="story">おやつを上手にわけられたから、仲間が増えたよ。</p><div class="actions">${btn('いっしょに あそぶ！','next','join')}</div></div>`;bind('join',()=>{forest.friends=Math.max(forest.friends,i+1);save();render()})}
function partyHome(){forest.friends=animals.length;save();bar.style.width='100%';let dec=['🌼','🎈','🌸','🎂','🎊'].slice(0,Math.min(5,Math.max(1,forest.partyWins+1))).join(' ');scene.innerHTML=`${friendBar()}<div class="badge">森のパーティー</div><h1>8ひき みんな そろった！</h1><div class="party"><div>${animals.map(a=>a.icon).join(' ')}</div><div class="decor">${dec}</div></div><p class="story">🐶いぬ、🐱ねこ、🦁ライオンも仲間入り！<br>好きなおやつを何回でもわけよう。</p><div class="actions">${btn('🍪 おやつを わける','share','party')}</div><div class="note">おてつだい ${forest.helps}かい　🎉 ${forest.partyWins}かい</div>`;bind('party',partyRound)}
function partyRound(){let ps=[{total:4,people:2,item:'🍪'},{total:6,people:2,item:'🍓'},{total:6,people:3,item:'🍬'},{total:8,people:4,item:'🍎'},{total:9,people:3,item:'🍇'}],s=ps[Math.floor(Math.random()*ps.length)];state={kind:'party',stage:s,remaining:s.total,counts:Array(s.people).fill(0),done:false};scene.innerHTML=`${friendBar()}<div class="badge">森のパーティー</div><h1>${s.item}を わけよう</h1><p class="story">${s.total}こを${s.people}人に同じだけ。</p><div class="pool"><div class="pool-title">おやつ：<span id="remaining"></span>こ</div><div class="pool-items" id="pool"></div></div><div class="people" id="people"></div><div class="feedback" id="feedback">👇 手で配ろう！</div><div class="celebrate" id="celebrate"></div><div class="answer" id="answer"></div>`;drawSource();drawPeople()}
function floatDrag(e,icon,onMove,onDrop){let src=e.currentTarget;try{src.setPointerCapture(e.pointerId)}catch(_){}src.style.opacity='.2';let g=document.createElement('div');g.className='ghost';g.textContent=icon;document.body.appendChild(g);move(e);function move(ev){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';onMove(ev.clientX,ev.clientY)}function clean(){g.remove();src.style.opacity='1';src.onpointermove=src.onpointerup=src.onpointercancel=null}src.onpointermove=move;src.onpointerup=()=>{clean();onDrop()};src.onpointercancel=()=>{clean();onMove(-999,-999)}}
render();
</script></body></html>
