<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わり算チャレンジ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#f5f3ff,#eefbf6);min-height:100vh;color:#263238}.wrap{width:min(720px,94%);margin:auto;padding:16px 0 38px}.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.back{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#fff;text-decoration:none;color:#475569;font-size:28px;font-weight:900;box-shadow:0 6px 18px rgba(30,41,59,.1)}h1{font-size:clamp(28px,8vw,40px);margin:0;text-align:center;flex:1;padding-right:48px}.card{background:#fff;border-radius:25px;padding:20px;box-shadow:0 14px 36px rgba(44,62,80,.12);margin-bottom:14px}.status{display:flex;justify-content:space-between;font-weight:900;color:#64748b}.progress{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:linear-gradient(90deg,#8b5cf6,#22c55e);width:0}.question{text-align:center;font-size:clamp(38px,11vw,64px);font-weight:950;margin:12px 0}.caption{text-align:center;font-weight:800;color:#64748b;line-height:1.6}.groups{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:14px 0}.group{background:#f8fafc;border:3px solid #c4b5fd;border-radius:17px;padding:10px;min-width:95px;text-align:center}.face{font-size:31px}.items{font-size:23px;line-height:1.4;min-height:34px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:480px;margin:15px auto}.choice{border:0;border-radius:18px;padding:15px;font-size:29px;font-weight:950;background:#eef2ff;color:#3730a3;min-height:66px}.choice.correct{background:#dcfce7;color:#166534;outline:3px solid #22c55e}.choice.wrong{background:#ffedd5;color:#9a3412;outline:3px solid #fb923c}.message{text-align:center;min-height:58px;font-size:20px;font-weight:900;line-height:1.5;margin-top:8px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.actions button{border:0;border-radius:16px;padding:13px 18px;font-size:17px;font-weight:900}.hint{background:#fef3c7;color:#92400e}.next{background:#4f46e5;color:#fff}.result{text-align:center;display:none}.result .big{font-size:72px}.result p{font-size:20px;line-height:1.7;color:#64748b;font-weight:700}.result a{display:inline-block;text-decoration:none;background:#16a34a;color:#fff;padding:14px 19px;border-radius:17px;font-weight:900;margin:5px}@media(max-width:480px){.card{padding:17px}.choices{gap:8px}.choice{font-size:26px}.group{min-width:82px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html" class="back">‹</a><h1>➗ 5問チャレンジ</h1></div>
  <div class="card"><div class="status"><span id="count">1 / 5</span><span id="score">できた 0</span></div><div class="progress"><div id="bar"></div></div></div>
  <main class="card" id="game">
    <div class="caption">図を見ながらでOK！ ひとり分は何こかな？</div>
    <div class="question" id="question"></div>
    <div class="groups" id="groups"></div>
    <div class="choices" id="choices"></div>
    <div class="message" id="message"></div>
    <div class="actions"><button class="hint" id="hint">💡 もっとヒント</button><button class="next" id="next" style="display:none">つぎへ →</button></div>
  </main>
  <section class="card result" id="result"><div class="big">🎉</div><h2>おしまい！</h2><p id="resultText"></p><a href="play.html?mode=share">🍬 もう少しわけわけ</a><a href="challenge.html">もう5問！</a></section>
</div>
<script>
const problems=[
 {a:4,b:2,item:'🍪'},{a:6,b:2,item:'🍓'},{a:6,b:3,item:'🍬'},{a:8,b:2,item:'🍎'},
 {a:8,b:4,item:'🧁'},{a:9,b:3,item:'🍇'},{a:10,b:2,item:'🍒'},{a:10,b:5,item:'⭐'},
 {a:12,b:3,item:'🥕'},{a:12,b:4,item:'🍩'}
];
const faces=['🐰','🐶','🐱','🐼','🦊'];
let current=0,score=0,answered=false,p;
function rand(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function repeat(x,n){return Array.from({length:n},()=>x).join('')}
function make(){
  p=problems[rand(problems.length)];answered=false;
  const answer=p.a/p.b;
  document.getElementById('question').textContent=`${p.a} ÷ ${p.b} = ?`;
  document.getElementById('groups').innerHTML=Array.from({length:p.b},(_,i)=>`<div class="group"><div class="face">${faces[i]}</div><div class="items">${repeat(p.item,answer)}</div><strong>${answer}こ</strong></div>`).join('');
  const vals=new Set([answer]);
  if(answer>1)vals.add(answer-1);vals.add(answer+1);if(vals.size<3)vals.add(answer+2);
  document.getElementById('choices').innerHTML=shuffle([...vals]).slice(0,3).map(v=>`<button class="choice" data-v="${v}">${v}</button>`).join('');
  document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.v),b)));
  document.getElementById('message').textContent='';document.getElementById('next').style.display='none';
  document.getElementById('count').textContent=`${current+1} / 5`;document.getElementById('score').textContent=`できた ${score}`;document.getElementById('bar').style.width=`${current/5*100}%`;
}
function choose(v,btn){
  if(answered)return;answered=true;const answer=p.a/p.b;
  document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(Number(b.dataset.v)===answer)b.classList.add('correct')});
  if(v===answer){score++;document.getElementById('message').textContent='⭕ できた！ 図と同じだね！'}else{btn.classList.add('wrong');document.getElementById('message').textContent=`だいじょうぶ！ 図を見ると、ひとり ${answer}こだね。`}
  document.getElementById('score').textContent=`できた ${score}`;document.getElementById('next').style.display='inline-block';
}
document.getElementById('hint').addEventListener('click',()=>{const answer=p.a/p.b;document.getElementById('message').textContent=`👀 ${faces[0]}さんの ${p.item} を数えてみよう。${answer}こあるよ！`});
document.getElementById('next').addEventListener('click',()=>{current++;if(current>=5)finish();else make()});
function finish(){document.getElementById('game').style.display='none';document.getElementById('result').style.display='block';document.getElementById('bar').style.width='100%';const t=score>=4?'すごい！ わり算の「同じ数ずつ分ける」がかなり分かってきたね。':score>=2?'よくできた！ 図を見ながらならちゃんと進められているよ。':'今日は「分ける」を見られただけでもOK。わけわけゲームでもう少し遊んでみよう。';document.getElementById('resultText').textContent=`5問中 ${score}問できたよ。${t}`}
make();
</script>
</body>
</html>
