<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わり算トレーニング</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif; background:linear-gradient(135deg,#f5f7ff,#eefbf6); min-height:100vh; color:#263238; }
.wrap { width:min(720px,94%); margin:0 auto; padding:24px 0 40px; }
.title { text-align:center; font-size:clamp(28px,7vw,46px); margin:8px 0 4px; }
.subtitle { text-align:center; color:#64748b; margin:0 0 14px; }
.learn-link { display:block; width:100%; margin:0 0 16px; padding:14px 16px; border-radius:16px; text-align:center; text-decoration:none; background:#eef2ff; color:#3730a3; font-weight:800; box-shadow:0 8px 24px rgba(79,70,229,.10); }
.card { background:rgba(255,255,255,.95); border-radius:24px; padding:22px; box-shadow:0 14px 40px rgba(44,62,80,.12); margin-bottom:16px; }
.controls { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
button { border:none; border-radius:15px; padding:13px 12px; font-size:16px; font-weight:700; cursor:pointer; transition:transform .08s,opacity .2s,box-shadow .2s; }
button:active { transform:scale(.98); }
.level { background:#edf2f7; color:#334155; }
.level.active { background:#4f46e5; color:white; box-shadow:0 5px 14px rgba(79,70,229,.25); }
.status { display:flex; justify-content:space-between; gap:10px; font-weight:700; color:#475569; margin-bottom:10px; }
.progress { width:100%; height:10px; background:#e8edf3; border-radius:999px; overflow:hidden; }
.progress > div { height:100%; width:0; background:linear-gradient(90deg,#4f46e5,#06b6d4); transition:width .25s; }
.question-card { text-align:center; }
.question { font-size:clamp(40px,11vw,72px); font-weight:800; letter-spacing:.02em; margin:20px 0; }
.answer-row { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
input { width:150px; font-size:34px; text-align:center; padding:10px; border:3px solid #cbd5e1; border-radius:18px; outline:none; }
input:focus { border-color:#6366f1; }
.check { background:#22c55e; color:white; min-width:120px; }
.next { background:#4f46e5; color:white; min-width:120px; }
.hint { background:#f59e0b; color:white; }
.message { min-height:54px; font-size:22px; font-weight:800; padding-top:15px; }
.correct { color:#16a34a; } .wrong { color:#dc2626; }
.hint-text { color:#64748b; font-size:16px; min-height:24px; margin-top:6px; }
.bottom-buttons { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
.restart { background:#e2e8f0; color:#334155; }
.result { display:none; text-align:center; }
.result .big { font-size:64px; margin:8px 0; }
.result h2 { font-size:32px; margin-bottom:4px; }
.result p { font-size:20px; }
.stars { font-size:40px; letter-spacing:6px; }
.problem-diagram { margin:4px auto 22px; padding:16px; max-width:620px; background:#f8fafc; border:2px solid #e2e8f0; border-radius:18px; }
.diagram-caption { font-weight:800; color:#475569; margin-bottom:12px; line-height:1.6; }
.problem-groups { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:stretch; }
.problem-group { min-width:102px; background:white; border:2px solid #c7d2fe; border-radius:14px; padding:9px; }
.problem-group-title { font-size:12px; font-weight:800; color:#6366f1; margin-bottom:7px; }
.problem-items { display:grid; grid-template-columns:repeat(5,16px); gap:4px; justify-content:center; }
.problem-item { width:16px; height:16px; background:#22c55e; border-radius:50%; }
.diagram-summary { margin-top:12px; font-size:15px; font-weight:800; color:#334155; line-height:1.6; }
.diagram-too-large { padding:10px; color:#64748b; font-weight:700; }
@media(max-width:500px){ .controls{grid-template-columns:1fr}.card{padding:18px}input{width:130px} }
</style>
</head>
<body>
<div class="wrap">
<h1 class="title">➗ わり算トレーニング</h1>
<p class="subtitle">10問チャレンジ！何問できるかな？</p>
<a class="learn-link" href="learn.html">📘 わり算のしくみを学ぶ</a>
<div class="card"><div class="controls"><button class="level active" data-level="easy">🌱 かんたん</button><button class="level" data-level="normal">🔥 ふつう</button><button class="level" data-level="hard">🚀 むずかしい</button></div></div>
<div class="card"><div class="status"><span id="count">1 / 10 問</span><span id="score">正解 0</span></div><div class="progress"><div id="bar"></div></div></div>
<div class="card question-card" id="game"><div class="question" id="question">12 ÷ 3 = ?</div><div class="problem-diagram" id="problemDiagram"><div class="diagram-caption" id="diagramCaption"></div><div class="problem-groups" id="problemGroups"></div><div class="diagram-summary" id="diagramSummary"></div></div><div class="answer-row"><input id="answer" type="number" inputmode="numeric" aria-label="答え"><button class="check" id="check">答える</button></div><div class="message" id="message"></div><div class="hint-text" id="hintText"></div><div class="bottom-buttons"><button class="hint" id="hint">💡 ヒント</button><button class="next" id="next" style="display:none;">次の問題 →</button><button class="restart" id="restart">最初から</button></div></div>
<div class="card result" id="result"><div class="big" id="resultEmoji">🎉</div><h2>チャレンジ終了！</h2><div class="stars" id="stars">⭐⭐⭐</div><p id="resultText"></p><button class="next" id="again">もう一回やる</button></div>
</div>
<script>
let level="easy",current=1,score=0,a=12,b=3,correct=4,answered=false;
const question=document.getElementById("question"),answer=document.getElementById("answer"),message=document.getElementById("message"),hintText=document.getElementById("hintText"),count=document.getElementById("count"),scoreEl=document.getElementById("score"),bar=document.getElementById("bar"),checkBtn=document.getElementById("check"),nextBtn=document.getElementById("next");
document.querySelectorAll(".level").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));btn.classList.add("active");level=btn.dataset.level;restart();}));
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function makeQuestion(){let quotient,divisor;if(level==="easy"){divisor=rand(2,9);quotient=rand(1,9);}else if(level==="normal"){divisor=rand(2,12);quotient=rand(2,15);}else{divisor=rand(3,25);quotient=rand(3,30);}a=divisor*quotient;b=divisor;correct=quotient;question.textContent=`${a} ÷ ${b} = ?`;renderProblemDiagram();answer.value="";answer.disabled=false;checkBtn.disabled=false;checkBtn.style.opacity="1";answered=false;message.textContent="";message.className="message";hintText.textContent="";nextBtn.style.display="none";updateStatus();setTimeout(()=>answer.focus(),50);}
function renderProblemDiagram(){const caption=document.getElementById("diagramCaption"),groups=document.getElementById("problemGroups"),summary=document.getElementById("diagramSummary");caption.textContent=`${a}こを、${b}このグループに同じ数ずつ分けます。`;groups.innerHTML="";const maxVisibleItems=120;for(let g=0;g<b;g++){const box=document.createElement("div");box.className="problem-group";const title=document.createElement("div");title.className="problem-group-title";title.textContent=`${g+1}グループ目`;box.appendChild(title);const items=document.createElement("div");items.className="problem-items";if(a<=maxVisibleItems){for(let i=0;i<correct;i++){const dot=document.createElement("span");dot.className="problem-item";items.appendChild(dot);}}else{const text=document.createElement("div");text.className="diagram-too-large";text.textContent=`● × ${correct}`;items.appendChild(text);}box.appendChild(items);groups.appendChild(box);}summary.textContent=`それぞれに同じ数だけ入ります。1グループに何こ入るかな？`;}
function updateStatus(){count.textContent=`${current} / 10 問`;scoreEl.textContent=`正解 ${score}`;bar.style.width=`${((current-1)/10)*100}%`;}
function checkAnswer(){if(answered)return;if(answer.value===""){message.textContent="答えを入力してね！";message.className="message wrong";return;}answered=true;const userAnswer=Number(answer.value);if(userAnswer===correct){score++;message.textContent="⭕ 正解！すごい！";message.className="message correct";}else{message.textContent=`❌ おしい！答えは ${correct}`;message.className="message wrong";}answer.disabled=true;checkBtn.disabled=true;checkBtn.style.opacity=".5";scoreEl.textContent=`正解 ${score}`;if(current<10)nextBtn.style.display="inline-block";else{bar.style.width="100%";setTimeout(showResult,500);}}
function next(){if(!answered)return;current++;makeQuestion();}
function showHint(){if(answered)return;let lower=Math.max(1,correct-rand(1,2)),upper=correct+rand(1,2);hintText.textContent=`${b} × 何 = ${a} になるかな？ 答えは ${lower}〜${upper} の間だよ。`;}
function showResult(){document.getElementById("game").style.display="none";document.getElementById("result").style.display="block";bar.style.width="100%";let stars="",emoji="",text="";if(score===10){stars="⭐⭐⭐⭐⭐";emoji="🏆";text="10問中10問正解！パーフェクト！";}else if(score>=8){stars="⭐⭐⭐⭐";emoji="🎉";text=`10問中${score}問正解！かなりできてる！`;}else if(score>=5){stars="⭐⭐⭐";emoji="😊";text=`10問中${score}問正解！もう一回やればもっと伸びるよ！`;}else{stars="⭐⭐";emoji="💪";text=`10問中${score}問正解！練習すればすぐ上手になるよ！`;}document.getElementById("stars").textContent=stars;document.getElementById("resultEmoji").textContent=emoji;document.getElementById("resultText").textContent=text;}
function restart(){current=1;score=0;document.getElementById("game").style.display="block";document.getElementById("result").style.display="none";makeQuestion();}
checkBtn.addEventListener("click",checkAnswer);nextBtn.addEventListener("click",next);document.getElementById("hint").addEventListener("click",showHint);document.getElementById("restart").addEventListener("click",restart);document.getElementById("again").addEventListener("click",restart);answer.addEventListener("keydown",e=>{if(e.key==="Enter"){if(answered&&current<10)next();else checkAnswer();}});makeQuestion();
</script>
</body>
</html>
